[project]
name = "tw-stock-fundamentals"
version = "0.1.0"
description = "台股波段股價預估：彭博終端風格的基本面分析網站"
authors = [{ name = "Zenobia000" }]
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi (>=0.115,<1.0)",
    "uvicorn[standard] (>=0.32,<1.0)",
    "httpx (>=0.27,<1.0)",
    "beautifulsoup4 (>=4.12,<5.0)",
    "lxml (>=5.3,<6.0)",
    "pandas (>=2.2,<3.0)",
    "jinja2 (>=3.1,<4.0)",
    "python-multipart (>=0.0.12,<1.0)",
    "apscheduler (>=3.10,<4.0)",
]

[tool.poetry]
packages = [{ include = "app" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
respx = "^0.22"
ruff = "^0.7"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
